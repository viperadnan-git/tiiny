[package]
name = "tiiny"
version = "2.1.0"
description = "Self-hosted link shortener that counts clicks, not people. Custom slugs, privacy-friendly stats and an admin panel in one small binary."
authors = ["Adnan Ahmad <viperadnan@gmail.com>"]
repository = "https://github.com/viperadnan-git/tiiny"
homepage = "https://github.com/viperadnan-git/tiiny"
readme = "README.md"
license = "MIT"
keywords = ["link-shortener", "url-shortener", "self-hosted", "axum", "libsql"]
categories = ["web-programming::http-server"]
edition = "2024"

[features]
test-mailer = []

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
async-trait = "0.1.92"
base64 = "0.22.1"
axum = "0.8.9"
axum-login = "0.18.0"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls"] }
libsql = "0.10.0"
maxminddb = "0.32.0"
moka = { version = "0.12.16", features = ["sync"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace", "compression-gzip", "request-id"] }
tower-sessions = { version = "0.14.0", default-features = false, features = ["axum-core"] }
tower_governor = { version = "0.8.0", default-features = false, features = ["axum"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = { version = "2.5.8", features = ["serde"] }
woothee = "0.13.0"
oauth2 = { version = "5.0.0", default-features = false, features = ["reqwest", "rustls-tls"] }
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
regex = "1.13.1"
garde = { version = "0.23.0", features = ["derive"] }
clap = { version = "4.6.7", features = ["derive"] }
figment = { version = "0.10.19", features = ["env"] }
axum-client-ip = "1.3.1"
dotenvy = "0.15.7"
tracing-appender = "0.2"
humantime = "2.4.0"

[dev-dependencies]
axum-test = "21.1.0"
tempfile = "3.27.0"
tiiny = { path = ".", features = ["test-mailer"] }
